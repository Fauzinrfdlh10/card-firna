<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kartu Nama Firna</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Playfair+Display:wght@500&display=swap');

    body {
      font-family: 'Poppins', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #f5f7fa 0%, #ffeef8 100%);
      margin: 0;
      padding: 20px;
    }

    .business-card {
      width: 420px;
      height: 240px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.1);
      padding: 30px;
      display: flex;
      position: relative;
      overflow: hidden;
      transition: transform 0.3s ease;
    }

    .business-card:hover {
      transform: translateY(-5px);
    }

    .business-card::before {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 120px;
      height: 120px;
      background: linear-gradient(45deg, #FF9A8B 0%, #FF6B95 50%, #FF8E53 100%);
      clip-path: circle(50% at 80% 20%);
      opacity: 0.8;
    }

    .business-card::after {
      content: '';
      position: absolute;
      bottom: -30px;
      left: -30px;
      width: 150px;
      height: 150px;
      background: linear-gradient(45deg, #4facfe 0%, #00f2fe 100%);
      clip-path: circle(40% at 30% 70%);
      opacity: 0.6;
      z-index: 1;
    }

    .photo-container {
      position: relative;
      z-index: 3;
      margin-right: 25px;
      align-self: center;
    }

    .photo {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid white;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      position: relative;
      z-index: 2;
    }

    .photo-container::before {
      content: '';
      position: absolute;
      width: 120px;
      height: 120px;
      background: linear-gradient(135deg, #FF9A8B 0%, #FF6B95 50%, #FF8E53 100%);
      border-radius: 50%;
      top: -5px;
      left: -5px;
      z-index: 1;
      animation: rotate 6s linear infinite;
    }

    @keyframes rotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .info {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 2;
    }

    .name {
      font-family: 'Playfair Display', serif;
      font-size: 26px;
      font-weight: 500;
      margin-bottom: 5px;
      color: #333;
      letter-spacing: 0.5px;
    }

    .title {
      font-size: 15px;
      color: #FF6B95;
      margin-bottom: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .company {
      font-weight: 600;
      color: #4facfe;
      margin-bottom: 12px;
      font-size: 16px;
      display: flex;
      align-items: center;
    }

    .company::before {
      content: '✨';
      margin-right: 8px;
      font-size: 14px;
    }

    .contact {
      margin-top: auto;
    }

    .contact p {
      margin: 5px 0;
      font-size: 13px;
      color: #666;
      display: flex;
      align-items: center;
    }

    .contact p::before {
      content: '';
      display: inline-block;
      width: 6px;
      height: 6px;
      background: linear-gradient(45deg, #FF9A8B 0%, #FF6B95 50%, #FF8E53 100%);
      border-radius: 50%;
      margin-right: 8px;
    }

    .social-media {
      display: flex;
      gap: 12px;
      margin-top: 10px;
    }

    .social-icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      animation: float 3s ease-in-out infinite;
    }

    .social-icon:hover {
      transform: scale(1.1);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    .whatsapp {
      background-color: rgba(37, 211, 102, 0.1);
      border: 1px solid rgba(37, 211, 102, 0.3);
    }

    .instagram {
      background-color: rgba(225, 48, 108, 0.1);
      border: 1px solid rgba(225, 48, 108, 0.3);
    }

    .social-icon svg {
      width: 14px;
      height: 14px;
    }

    .wa-icon {
      fill: #25D366;
    }

    .ig-icon {
      fill: #E1306C;
    }

    .decoration {
      position: absolute;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: linear-gradient(45deg, #4facfe 0%, #00f2fe 100%);
      opacity: 0.7;
    }

    .dec1 {
      bottom: 20px;
      right: 40px;
      width: 12px;
      height: 12px;
    }

    .dec2 {
      top: 30px;
      right: 100px;
      width: 8px;
      height: 8px;
    }

    .dec3 {
      bottom: 50px;
      right: 20px;
      width: 15px;
      height: 15px;
    }
  </style>
